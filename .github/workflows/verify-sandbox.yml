# verify-sandbox: the rollout's sandbox gate (docs/getting-started.md, "Running
# the sandbox check"), against a scratch repo in this owner and nothing else.
#
# Dispatch only, from main (the environments admit no other ref). Each job
# mints its App's token for the sandbox alone, so no token minted here can reach
# any other repo. The command also refuses qlander.yml's target and control
# repos, by id and by name, and stops before any write unless every token
# reaches the sandbox and no other repo.
#
# Three jobs, one App key each, in order. Each later job attacks the epoch
# branches the earlier ones made:
#   queue    queue-write:   G1 (queue App and state App), and the queue epoch
#   release  release-write: the release epoch; the queue epoch as the other App
#   cross    queue-write:   the release epoch as the other App
# The admin phase runs on your own machine, with an org admin's token.
#
# Unlike tick.yml, this file is not rendered: edit it by hand if you must.

name: verify-sandbox

on:
  workflow_dispatch:
    inputs:
      sandbox:
        description: The sandbox repo's name, in this owner
        required: true
        type: string
      sandbox-id:
        description: The sandbox repo's numeric id
        required: true
        type: string

permissions: {}

concurrency:
  group: qlander-verify-sandbox
  cancel-in-progress: false

jobs:
  queue:
    name: verify-sandbox queue
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: queue-write
    permissions:
      contents: read # read the pins and the config; the sandbox is reached only with the App tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the queue App token (the sandbox only)
        id: queue
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.sandbox }}
          permission-contents: write # refs, commits, merges
          permission-workflows: write # G1 lands a change to .github/workflows/
          permission-pull-requests: write # G1 opens two PRs
          permission-actions: read # H1 check 4 lists workflow runs

      - name: Mint the state App token (the sandbox's contents only)
        id: state
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.STATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.sandbox }}
          permission-contents: write

      - name: Run verify-sandbox queue
        env:
          VERIFY_QUEUE_TOKEN: ${{ steps.queue.outputs.token }}
          VERIFY_STATE_TOKEN: ${{ steps.state.outputs.token }}
          SANDBOX: ${{ github.repository_owner }}/${{ inputs.sandbox }}
          SANDBOX_ID: ${{ inputs.sandbox-id }}
        run: |
          set -euo pipefail
          read -r version asset sum < .github/bun-release.txt
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$asset" "https://github.com/oven-sh/bun/releases/download/bun-v${version}/${asset}"
          (cd "$dir" && echo "${sum}  ${asset}" | sha256sum -c -)
          unzip -q "$dir/$asset" -d "$dir"
          bun="$dir/${asset%.zip}/bun"
          read -r relversion relasset relsum < .github/qlander-release.txt
          [[ "$relasset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.js$ ]]
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$relasset" "https://github.com/brett/qlander/releases/download/v${relversion}/${relasset}"
          (cd "$dir" && echo "${relsum}  ${relasset}" | sha256sum -c -)
          "$bun" "$dir/$relasset" verify-sandbox queue --repo "$SANDBOX" --repo-id "$SANDBOX_ID" --config qlander.yml

  release:
    name: verify-sandbox release
    needs: queue
    # After the queue job, whatever its result, so one dispatch reports every check.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-write
    permissions:
      contents: read # read the pins and the config; the sandbox is reached only with the App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the release App token (the sandbox only)
        id: release
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.sandbox }}
          permission-contents: write # refs and commits
          permission-actions: read # H1 check 4 lists workflow runs

      - name: Run verify-sandbox release
        env:
          VERIFY_RELEASE_TOKEN: ${{ steps.release.outputs.token }}
          SANDBOX: ${{ github.repository_owner }}/${{ inputs.sandbox }}
          SANDBOX_ID: ${{ inputs.sandbox-id }}
        run: |
          set -euo pipefail
          read -r version asset sum < .github/bun-release.txt
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$asset" "https://github.com/oven-sh/bun/releases/download/bun-v${version}/${asset}"
          (cd "$dir" && echo "${sum}  ${asset}" | sha256sum -c -)
          unzip -q "$dir/$asset" -d "$dir"
          bun="$dir/${asset%.zip}/bun"
          read -r relversion relasset relsum < .github/qlander-release.txt
          [[ "$relasset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.js$ ]]
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$relasset" "https://github.com/brett/qlander/releases/download/v${relversion}/${relasset}"
          (cd "$dir" && echo "${relsum}  ${relasset}" | sha256sum -c -)
          "$bun" "$dir/$relasset" verify-sandbox release --repo "$SANDBOX" --repo-id "$SANDBOX_ID" --config qlander.yml

  cross:
    name: verify-sandbox cross
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: queue-write
    permissions:
      contents: read # read the pins and the config; the sandbox is reached only with the App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the queue App token (the sandbox only)
        id: queue
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.sandbox }}
          permission-contents: write # the reset attempts must be refused by the rulesets, not for want of a permission

      - name: Run verify-sandbox cross
        env:
          VERIFY_QUEUE_TOKEN: ${{ steps.queue.outputs.token }}
          SANDBOX: ${{ github.repository_owner }}/${{ inputs.sandbox }}
          SANDBOX_ID: ${{ inputs.sandbox-id }}
        run: |
          set -euo pipefail
          read -r version asset sum < .github/bun-release.txt
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$asset" "https://github.com/oven-sh/bun/releases/download/bun-v${version}/${asset}"
          (cd "$dir" && echo "${sum}  ${asset}" | sha256sum -c -)
          unzip -q "$dir/$asset" -d "$dir"
          bun="$dir/${asset%.zip}/bun"
          read -r relversion relasset relsum < .github/qlander-release.txt
          [[ "$relasset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.js$ ]]
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/$relasset" "https://github.com/brett/qlander/releases/download/v${relversion}/${relasset}"
          (cd "$dir" && echo "${relsum}  ${relasset}" | sha256sum -c -)
          "$bun" "$dir/$relasset" verify-sandbox cross --repo "$SANDBOX" --repo-id "$SANDBOX_ID" --config qlander.yml
