# CI for every pull request to this control repo: the config is valid, the
# checked-in tick.yml and watchdog.yml are exactly what the pinned release
# renders from it, and the workflows pass zizmor and actionlint.
# GitHub-hosted runners, no secrets, no environments, read-only token.
# Unlike tick.yml, this file is not rendered: edit it by hand if you must.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: validate and render --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the config and check the rendered workflows, with the pinned release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The same downloads as tick.yml: Bun and the pinned qlander
          # release, each checked against its committed sha256.
          read -r version asset sum < .github/bun-release.txt
          dir="$(mktemp -d)"
          timeout 40 curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --connect-timeout 5 --speed-limit 1024 --speed-time 10 \
            --output "$dir/$asset" "https://github.com/oven-sh/bun/releases/download/bun-v${version}/${asset}"
          (cd "$dir" && echo "${sum}  ${asset}" | sha256sum -c -)
          unzip -q "$dir/$asset" -d "$dir"
          bun="$dir/${asset%.zip}/bun"
          read -r relversion relasset relsum < .github/qlander-release.txt
          [[ "$relasset" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.js$ ]]
          # A private release of qlander-sandbox/widgets-qlander,
          # read through the API with this job's own token (contents: read),
          # passed on stdin so it is never in a command line. curl drops it on
          # the redirect to the asset's storage host.
          releases="https://api.github.com/repos/qlander-sandbox/widgets-qlander/releases"
          auth() { printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN"; }
          auth | timeout 10 curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --connect-timeout 5 --speed-limit 1024 --speed-time 10 \
            --header @- --header "Accept: application/vnd.github+json" \
            --output "$dir/release.json" "$releases/tags/v${relversion}"
          id="$(RELEASE="$dir/release.json" ASSET="$relasset" "$bun" -e 'const a = (await Bun.file(process.env.RELEASE).json()).assets.filter((x) => x.name === process.env.ASSET); if (a.length !== 1) throw new Error("the release has no single asset " + process.env.ASSET); console.log(a[0].id)')"
          [[ "$id" =~ ^[0-9]+$ ]]
          auth | timeout 20 curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --connect-timeout 5 --speed-limit 1024 --speed-time 10 \
            --header @- --header "Accept: application/octet-stream" \
            --output "$dir/$relasset" "$releases/assets/${id}"
          (cd "$dir" && echo "${relsum}  ${relasset}" | sha256sum -c -)
          "$bun" "$dir/$relasset" validate --config qlander.yml
          "$bun" "$dir/$relasset" render --check --config qlander.yml

  workflows:
    name: zizmor and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.30.1 --pedantic --offline .github/workflows
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
